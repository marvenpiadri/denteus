name: Backend checks

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-checks.yml'
  push:
    branches:
      - main
      - feat/postgres-tenant-foundation
    paths:
      - 'backend/**'
      - '.github/workflows/backend-checks.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test role policy
        run: npm test
